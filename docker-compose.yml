name: finflow
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: finflow, POSTGRES_PASSWORD: finflow}
    ports: ["5432:5432"]
    volumes: ["./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U finflow"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  kafka:
    image: bitnami/kafka:3.8
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
  zipkin:
    image: openzipkin/zipkin:latest
    ports: ["9411:9411"]
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    volumes: ["./infra/grafana/provisioning:/etc/grafana/provisioning:ro","./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
  loki:
    image: grafana/loki:latest
    ports: ["3100:3100"]
  toxiproxy:
    image: shopify/toxiproxy:2.9.0
    ports: ["8474:8474","8666:8666"]
